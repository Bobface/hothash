[package]
name = "hothash-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Latency benchmark of hothash against popular Rust hashes, 0 B to 1 GiB"

[dependencies]
hothash = { path = ".." }
ahash = "0.8.12"
foldhash = "0.2.0"
gxhash = "3.5.0"
gxhash_hybrid = { package = "gxhash", git = "https://github.com/ogxd/gxhash", tag = "3.5.0", features = ["hybrid"] }
libc = "0.2"
rapidhash = "4.5.1"
rustc-hash = "2.1.3"
wyhash = "0.6.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3", "const_xxh3"] }

[profile.release]
codegen-units = 1
lto = "fat"
debug = 1

[[bin]]
name = "latency"
path = "src/main.rs"
